name: yggdrasil-dev

services:
  nginx:
    image: nginx:alpine
    ports:
      - "${DEV_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - landing
      - web
      - docusaurus
      - api
      - orchestrator

  postgres:
    image: postgres:16-alpine
    ports:
      - "${DEV_POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yggdrasil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yggdrasil}
      POSTGRES_DB: ${POSTGRES_DB:-yggdrasil}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yggdrasil}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data

  api:
    build:
      context: ../api
      dockerfile: deploy/Dockerfile.dev
    env_file:
      - ../api/.env
    environment:
      PORT: ${API_PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-yggdrasil}:${POSTGRES_PASSWORD:-yggdrasil}@postgres:5432/${POSTGRES_DB:-yggdrasil}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080/app}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8080/api}
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${MINIO_BUCKET:-yggdrasil}
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      ORCHESTRATOR_URL: http://orchestrator:8080
    volumes:
      - ../api:/app
      - api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../web
      dockerfile: deploy/Dockerfile.dev
    environment:
      PORT: 3000
      NEXT_PUBLIC_BASE_PATH: ${WEB_BASE_PATH:-/app}
      NEXT_PUBLIC_API_BASE_URL: ${WEB_API_BASE_URL:-/api}
      NEXT_PUBLIC_USE_MSW: "false"
      API_INTERNAL_URL: http://api:3000
    volumes:
      - ../web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

  landing:
    build:
      context: ../landing
      dockerfile: deploy/Dockerfile.dev
    environment:
      PORT: 3000
    volumes:
      - ../landing:/app
      - landing_node_modules:/app/node_modules

  docusaurus:
    build:
      context: ../docusaurus
      dockerfile: deploy/Dockerfile.dev
    environment:
      PORT: 3000
      DOCS_BASE_URL: ${DOCS_BASE_URL:-/docs/}
      DOCS_SITE_URL: ${DOCS_SITE_URL:-http://localhost:8080}
    volumes:
      - ../docusaurus:/app
      - docusaurus_node_modules:/app/node_modules

  orchestrator:
    build:
      context: ../orchestrator
      dockerfile: deploy/Dockerfile.dev
    env_file:
      - ../orchestrator/.env
    environment:
      PORT: ${ORCHESTRATOR_PORT:-8080}
      DATABASE_URL: postgresql://${POSTGRES_USER:-yggdrasil}:${POSTGRES_PASSWORD:-yggdrasil}@postgres:5432/${POSTGRES_DB:-yggdrasil}
      # Local dev only: the disposable k3s cluster below, reached over this
      # same Docker network. Not part of the bundled-k3s self-hosted story
      # yet (that targets a real install, not dev) — see ADR 003 follow-ups.
      KUBECONFIG: /kube/config
    volumes:
      - ../orchestrator:/app
      - orchestrator_go_pkg:/go/pkg
      - orchestrator_kubeconfig:/kube:ro
    depends_on:
      postgres:
        condition: service_healthy
      k3s-kubeconfig:
        condition: service_completed_successfully

  # Disposable single-node Kubernetes cluster for local dev (ADR 003 targets
  # Kubernetes, not a Docker socket). Bundles Traefik + local-path storage,
  # same as k3d did in the old host-side setup. State lives in the k3s_data
  # volume; delete it (`docker compose down -v`) for a clean cluster.
  k3s:
    image: rancher/k3s:v1.32.5-k3s1
    privileged: true
    # Without a fixed hostname, Docker assigns a random one per container, and
    # k3s uses it as the node name — recreating the container (e.g. `up
    # --build`) would then register a second, permanently-stale node next to
    # the old one in the state persisted in k3s_data.
    hostname: k3s
    tmpfs:
      - /run
      - /var/run
    environment:
      K3S_KUBECONFIG_OUTPUT: /output/kubeconfig.yaml
      K3S_KUBECONFIG_MODE: "644"
    # --tls-san lets the server cert validate when reached as "k3s" (this
    # service's Docker DNS name) — the default cert only covers
    # localhost/127.0.0.1.
    command: server --tls-san=k3s --write-kubeconfig-mode=644
    volumes:
      - k3s_data:/var/lib/rancher/k3s
      - k3s_kubeconfig:/output
    ports:
      - "${DEV_K3S_PORT:-6443}:6443"
    healthcheck:
      test: ["CMD", "kubectl", "get", "--raw=/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # One-shot: k3s writes its kubeconfig with `server: https://127.0.0.1:6443`,
  # which only resolves from inside the k3s container itself. Rewrites that
  # to an address reachable from the orchestrator container (Docker DNS name
  # "k3s") and, separately, from the host (for your own kubectl/cert-manager
  # setup — see orchestrator/docs/overview/setup.md).
  k3s-kubeconfig:
    image: alpine:3.20
    depends_on:
      k3s:
        condition: service_healthy
    volumes:
      - k3s_kubeconfig:/input:ro
      - orchestrator_kubeconfig:/output
      - ./.kube:/host-output
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        until [ -s /input/kubeconfig.yaml ]; do sleep 1; done
        sed 's#server: https://127.0.0.1:6443#server: https://k3s:6443#' \
          /input/kubeconfig.yaml > /output/config
        sed 's#server: https://127.0.0.1:6443#server: https://localhost:${DEV_K3S_PORT:-6443}#' \
          /input/kubeconfig.yaml > /host-output/config-host
        chmod 644 /output/config /host-output/config-host
    restart: "no"

  # Web UI for poking around the bundled dev k3s cluster (pods, logs, events
  # for orchestrator-launched jobs) without needing kubectl on the host.
  # Reuses the same rewritten kubeconfig the orchestrator mounts, so no
  # separate RBAC/token setup — talk to it directly via port ${DEV_K8S_DASHBOARD_PORT:-4466},
  # not through the nginx path router.
  k8s-dashboard:
    image: ghcr.io/headlamp-k8s/headlamp:latest
    environment:
      KUBECONFIG: /kube/config
    volumes:
      - orchestrator_kubeconfig:/kube:ro
    ports:
      - "${DEV_K8S_DASHBOARD_PORT:-4466}:4466"
    depends_on:
      k3s-kubeconfig:
        condition: service_completed_successfully

volumes:
  postgres_data:
  minio_data:
  api_node_modules:
  web_node_modules:
  landing_node_modules:
  docusaurus_node_modules:
  orchestrator_go_pkg:
  k3s_data:
  k3s_kubeconfig:
  orchestrator_kubeconfig:
