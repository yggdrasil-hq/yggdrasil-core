name: yggdrasil-dev

services:
  nginx:
    image: nginx:alpine
    ports:
      - "${DEV_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - landing
      - web
      - docusaurus
      - api
      - orchestrator

  postgres:
    image: postgres:16-alpine
    ports:
      - "${DEV_POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yggdrasil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yggdrasil}
      POSTGRES_DB: ${POSTGRES_DB:-yggdrasil}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yggdrasil}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data

  api:
    build:
      context: ../api
      dockerfile: deploy/Dockerfile.dev
    env_file:
      - ../api/.env
    environment:
      PORT: ${API_PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-yggdrasil}:${POSTGRES_PASSWORD:-yggdrasil}@postgres:5432/${POSTGRES_DB:-yggdrasil}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080/app}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8080/api}
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${MINIO_BUCKET:-yggdrasil}
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      ORCHESTRATOR_URL: http://orchestrator:8080
    volumes:
      - ../api:/app
      - api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../web
      dockerfile: deploy/Dockerfile.dev
    environment:
      PORT: 3000
      NEXT_PUBLIC_BASE_PATH: ${WEB_BASE_PATH:-/app}
      NEXT_PUBLIC_API_BASE_URL: ${WEB_API_BASE_URL:-/api}
      NEXT_PUBLIC_USE_MSW: "false"
      API_INTERNAL_URL: http://api:3000
    volumes:
      - ../web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

  landing:
    build:
      context: ../landing
      dockerfile: deploy/Dockerfile.dev
    environment:
      PORT: 3000
    volumes:
      - ../landing:/app
      - landing_node_modules:/app/node_modules

  docusaurus:
    build:
      context: ../docusaurus
      dockerfile: deploy/Dockerfile.dev
    environment:
      PORT: 3000
      DOCS_BASE_URL: ${DOCS_BASE_URL:-/docs/}
      DOCS_SITE_URL: ${DOCS_SITE_URL:-http://localhost:8080}
    volumes:
      - ../docusaurus:/app
      - docusaurus_node_modules:/app/node_modules

  orchestrator:
    build:
      context: ../orchestrator
      dockerfile: deploy/Dockerfile.dev
    env_file:
      - ../orchestrator/.env
    environment:
      PORT: ${ORCHESTRATOR_PORT:-8080}
    volumes:
      - ../orchestrator:/app
      - orchestrator_go_pkg:/go/pkg
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
  api_node_modules:
  web_node_modules:
  landing_node_modules:
  docusaurus_node_modules:
  orchestrator_go_pkg:
