name: yggdrasil-prod

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    environment:
      LANDING_HOST: ${LANDING_HOST}
      APP_HOST: ${APP_HOST}
      DOCS_HOST: ${DOCS_HOST}
      API_HOST: ${API_HOST}
      ORCHESTRATOR_HOST: ${ORCHESTRATOR_HOST}
      PREVIEW_HOST: ${PREVIEW_HOST}
    volumes:
      - ./nginx/prod.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      landing:
        condition: service_started
        restart: true
      web:
        condition: service_started
        restart: true
      docusaurus:
        condition: service_started
        restart: true
      api:
        condition: service_started
        restart: true
      orchestrator:
        condition: service_started
        restart: true

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    restart: unless-stopped

  api:
    build:
      context: ../api
      dockerfile: deploy/Dockerfile.prod
    env_file:
      - ../api/.env
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${MINIO_BUCKET}
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      ORCHESTRATOR_URL: http://orchestrator:8080
      # Subdomain deploy (not path-based like dev) — browser-facing URLs and
      # OAuth redirects must point at the real public hosts.
      APP_PUBLIC_URL: https://${APP_HOST}
      API_PUBLIC_URL: https://${API_HOST}
      # Must match the orchestrator's own APPS_BASE_DOMAIN exactly (ADR 003
      # §15) — the two are set independently, kept in sync via this shared
      # root .env value.
      APPS_BASE_DOMAIN: ${APPS_BASE_DOMAIN}
      # Shared bearer token the orchestrator uses to fetch decrypted project
      # secrets from this service (ADR 003 §16) — same value on both sides.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ../web
      dockerfile: deploy/Dockerfile.prod
    environment:
      PORT: 3000
      NEXT_PUBLIC_BASE_PATH: ""
      # Browser-facing API origin (subdomain deploy, not the dev /api path
      # prefix) plus the server-side (Docker-network) API URL for
      # middleware/RSC calls.
      NEXT_PUBLIC_API_BASE_URL: https://${API_HOST}
      API_INTERNAL_URL: http://api:3000
    restart: unless-stopped
    depends_on:
      - api

  landing:
    build:
      context: ../landing
      dockerfile: deploy/Dockerfile.prod
    environment:
      PORT: 3000
    restart: unless-stopped

  docusaurus:
    build:
      context: ../docusaurus
      dockerfile: deploy/Dockerfile.prod
    environment:
      PORT: 3000
      DOCS_BASE_URL: /
      DOCS_SITE_URL: https://${DOCS_HOST}
    restart: unless-stopped

  orchestrator:
    build:
      context: ../orchestrator
      dockerfile: deploy/Dockerfile.prod
    env_file:
      - ../orchestrator/.env
    environment:
      PORT: 8080
      # Postgres-backed job/deploy queue (ADR 003) — same `jobs` table the
      # API writes to.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      API_INTERNAL_URL: http://api:3000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      # Must match the api service's APPS_BASE_DOMAIN exactly (ADR 003 §15).
      APPS_BASE_DOMAIN: ${APPS_BASE_DOMAIN}
      INGRESS_CLASS_NAME: ${INGRESS_CLASS_NAME:-ingress-nginx}
      CERT_ISSUER_NAME: ${CERT_ISSUER_NAME:-letsencrypt-prod}
      # Per ADR 016 the orchestrator resolves each job's target Kubernetes
      # cluster dynamically from the organization's stored kubeconfig (via the
      # API) — there is no mounted per-instance kubeconfig file anymore.
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
